name: 2 - Post next Reel
on:
  schedule:                      # توقيت UTC. المغرب = UTC+1 (UTC+0 في رمضان). عدّلها كما تشاء
    - cron: "0 6 * * *"          # ≈ 07:00
    - cron: "0 12 * * *"         # ≈ 13:00
    - cron: "0 19 * * *"         # ≈ 20:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة: أنتج 3 فيديوهات للمراجعة دون نشر"
        type: boolean
        default: true
concurrency:
  group: post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python setup_assets.py
      - name: Download backgrounds from Release "backgrounds" (if any)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download backgrounds --pattern '*' --dir backgrounds --clobber || echo "no release assets, using repo files"
      - name: Dry run (review only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python post_once.py --dry-run
      - name: Upload samples
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with: { name: sample-videos, path: out/videos/*.mp4 }
      - name: Post Reel
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_once.py
      - name: Save progress
        if: always()
        run: |
          git config user.name "reels-bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json skipped_long.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "progress"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi
